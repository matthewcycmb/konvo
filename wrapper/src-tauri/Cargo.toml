[package]
name = "instamessages-wrapper"
version = "0.1.0"
description = "Caged instagram.com: DMs only, no feed, no reels"
edition = "2021"

[lib]
name = "instamessages_wrapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# konvo-beta: tester builds with no funnel and no paywall. A cargo feature,
# NOT an env var: xcodebuild strips the calling shell's env before the Build
# Rust Code phase, so option_env! silently compiled the flag out. The tauri
# CLI's --features flag is the channel that survives that boundary.
[features]
onboarding-preview = []
konvo-beta = []
# konvo-free: the App Store v1.0. Onboarding and the post-login sequence run
# in full - including the delete-Instagram step, which IS the product
# argument - but no price screen and no wall. Monetisation is banked for
# v1.1: RevenueCat, the products and the paywall are all built and tested,
# and turning them on is this flag plus a review.
konvo-free = []

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde_json = "1"

# Pinning the webview to the safe area needs a handful of UIKit message sends.
# Already in the tree via wry, so this costs a line here and nothing to build.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

# Native unread-DM notifications. macOS only: the Mac app stays alive hidden,
# so its webview can watch for new messages; iOS cannot, and gets nothing.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notification = "2"

[profile.release]
strip = true
lto = true
