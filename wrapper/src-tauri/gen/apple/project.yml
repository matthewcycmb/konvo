name: instamessages-wrapper
options:
  bundleIdPrefix: com.matthewchan.konvo
  deploymentTarget:
    # 15.0 is the StoreKit 2 floor (KonvoStore.swift); was 14.0 pre-paywall.
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
# RevenueCat + Superwall SDKs (KonvoStore.swift). Mirrored by hand in
# project.pbxproj: xcodegen only runs at regeneration time, so both must
# carry them.
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    majorVersion: 5.0.0
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS
    majorVersion: 4.0.0
  # In-app feedback board (Sep 1). Pre-1.0, so pinned exactly: their docs
  # warn the API moves before 1.0.
  UserJot:
    url: https://github.com/UserJot/userjot-ios
    exactVersion: 0.3.0
settingGroups:
  app:
    base:
      PRODUCT_NAME: Konvo
      PRODUCT_BUNDLE_IDENTIFIER: com.matthewchan.konvo
      DEVELOPMENT_TEAM: JBTFJ7JD4R
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
      - path: Shared
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  instamessages-wrapper_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Assets.xcassets
      # buildPhase: none, or xcodegen classifies whatever libapp.a happens to
      # be sitting in Externals at generation time as a *resource* and copies
      # it into the .app — a 132MB static library inside a 2.8MB app. The
      # target links it properly via the libapp.a dependency below; this path
      # exists only so the group shows up in Xcode.
      - path: Externals
        buildPhase: none
      - path: instamessages-wrapper_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      # Simulated products for the dev inner loop (Xcode scheme > run uses it
      # below); the final pass runs against the real App Store sandbox.
      - path: Konvo.storekit
        buildPhase: none
    info:
      path: instamessages-wrapper_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        # The funnel and the paywall translate themselves in the webview
        # (dist/index.html, cage.js); this list is what puts Konvo in
        # Settings > Konvo > Language and on the store page's language row.
        CFBundleLocalizations: [en, fr, zh-Hant, ko]
        # Background App Refresh (Sep 1): iOS wakes Konvo now and then to
        # check Instagram's unread badge with the saved session and post a
        # local "N unread conversations" notification. No server involved.
        # remote-notification (Sep 1, option B): konvoinstall.com's silent
        # push wakes the same check every 15 minutes.
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.matthewchan.konvo.refresh]
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The build patches both from tauri.conf.json; these only matter if
        # xcodegen regenerates between builds, so keep them current-ish.
        CFBundleShortVersionString: 1.9.0
        CFBundleVersion: "130"
    entitlements:
      path: instamessages-wrapper_iOS/instamessages-wrapper_iOS.entitlements
      properties:
        com.apple.developer.family-controls: true
        # Push (Sep 1): development here; Xcode's store export rewrites it
        # to production from the distribution profile.
        aps-environment: development
        # Shared with KonvoActivityMonitor: the relock extension reads the
        # cage selection from here with the app dead.
        com.apple.security.application-groups:
          - group.com.matthewchan.konvo
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
      storeKitConfiguration: Konvo.storekit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        # Tauri's "Build Rust Code" phase reads project files and writes
        # Externals/, which Xcode's script sandbox forbids (EPERM). Never
        # accept Xcode's "update to recommended settings" nag: it flips
        # this on and every build fails.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # iPhone only. The cage rules target Instagram's *mobile web* layout;
        # at iPad width Instagram serves a wider layout whose nav lives in
        # different containers, so the selectors miss and the cage leaks.
        # Shipping "1,2" means App Review runs it on an iPad and sees exactly
        # that.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - package: RevenueCat
      # RevenueCat Paywalls (Sep 1): the remotely designed price screen.
      - package: RevenueCat
        product: RevenueCatUI
      - package: SuperwallKit
      - package: UserJot
      # The Screen Time cage's shield extensions (custom shield UI + button
      # handling for a caged Instagram). Both are pure Swift, no Rust.
      - target: KonvoShieldConfig
        embed: true
      - target: KonvoShieldAction
        embed: true
      - target: KonvoActivityMonitor
        embed: true
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: StoreKit.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a

  # Screen Time cage extensions. iOS 16 floor: individual FamilyControls
  # authorization does not exist below it. The main app stays at 15.0 and
  # gates the cage at runtime.
  KonvoShieldConfig:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ShieldConfig
    entitlements:
      path: ShieldConfig/KonvoShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: Konvo Shield
        CFBundleShortVersionString: 1.9.0
        CFBundleVersion: "130"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewchan.konvo.shieldconfig
        DEVELOPMENT_TEAM: JBTFJ7JD4R
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: false
        ARCHS: [arm64]
  KonvoActivityMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ActivityMonitor
      - path: Shared
    entitlements:
      path: ActivityMonitor/KonvoActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.matthewchan.konvo
    info:
      path: ActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: Konvo Relock
        CFBundleShortVersionString: 1.9.0
        CFBundleVersion: "130"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KonvoActivityMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewchan.konvo.activitymonitor
        DEVELOPMENT_TEAM: JBTFJ7JD4R
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: false
        ARCHS: [arm64]
  KonvoShieldAction:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ShieldAction
    entitlements:
      path: ShieldAction/KonvoShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Konvo Shield Action
        CFBundleShortVersionString: 1.9.0
        CFBundleVersion: "130"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewchan.konvo.shieldaction
        DEVELOPMENT_TEAM: JBTFJ7JD4R
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: false
        ARCHS: [arm64]