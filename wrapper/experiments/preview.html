<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konvo · Production onboarding QA</title><style>body{margin:0;background:#eef1f8;font:14px system-ui;color:#141d33}aside{max-width:700px;margin:20px auto;padding:0 20px}label{display:inline-block;margin:5px}input,select,button{font:inherit;padding:8px;border:1px solid #ccd4e5;border-radius:8px;background:white}#device{width:390px;height:844px;margin:20px auto;border:8px solid #172032;border-radius:38px;overflow:hidden;background:#fff}#mount{height:100%}#demo-inbox{position:absolute;left:-10000px;width:390px;background:white;padding:20px;box-sizing:border-box}#demo-inbox h2{font-size:20px}#demo-inbox p{padding:20px 0;border-bottom:1px solid #eee}small{display:block;margin:8px 0}a{color:#0a5cf0}</style></head><body><aside><b>Konvo · New production flow</b><small>Local QA only. Example inbox and prices. Purchases are simulated; no analytics are sent.</small><label>Username <input id="username" value="your_username" maxlength="30"></label><label>Instagram <select id="before"><option value="45">&lt; 1 hour</option><option value="90">1–2 hours</option><option value="150" selected>2–3 hours</option><option value="210">3–4 hours</option><option value="300">&gt; 4 hours</option><option value="unknown">Not sure</option></select></label><label>DMs <select id="after"><option value="10">&lt; 10 mins</option><option value="20" selected>10–20 mins</option><option value="30">20–30 mins</option><option value="45">30–45 mins</option><option value="60">45–60 mins</option><option value="unknown">Not sure</option></select></label><button id="restart">Restart</button><button id="show-paywall">Paywall</button><button id="show-gift">Gift reveal</button><small><a href="../prototype/onboarding-all-pages.html">Full onboarding gallery</a> · Original onboarding remains in the app.</small></aside><main id="demo-inbox"><h2>Demo inbox</h2><p>Alex<br>See you this weekend!</p><p>Jamie<br>Sent you a message</p><p>Sam<br>Thanks!</p></main><div id="device"><div id="mount"></div></div><script src="../src-tauri/src/onboarding-views.js"></script><script src="../src-tauri/src/onboarding-experiment.js"></script><script>
let view;window.events=[];function start(initial){if(view)view.destroy();const host=document.createElement('div');host.id='mount';document.querySelector('#device').replaceChildren(host);const before=document.querySelector('#before'),after=document.querySelector('#after');view=KonvoOnboardingExperiment.mount(host,{initial,answers:{instagramMinutes:Number(before.value),messagingMinutes:Number(after.value),instagramLabel:before.selectedOptions[0].textContent,instagramUnknown:before.value==='unknown',messagingUnknown:after.value==='unknown'},handle:()=>document.querySelector('#username').value.replace(/[^a-zA-Z0-9._]/g,''),track:(e,p)=>events.push({event:e,properties:p}),products:()=>({offeringId:'qa_example',yearly:{productId:'qa.annual.no_trial',price:'$24.99',perWeek:'$0.48',currency:'USD',amount:24.99,noIntroOffer:true,trialDays:0},weekly:{productId:'konvo.pro.weeklyy',price:'$6.99',annualizedPrice:'$363.48',currency:'USD',amount:6.99,noIntroOffer:true},specialOffer:{offeringId:'konvo_special_offer_v1',productId:'konvo.pro.yearly.special',price:'$19.99',perWeek:'$0.38',currency:'USD',amount:19.99,noIntroOffer:true}}),impression:()=>{},refresh:f=>f(),buy:(id,done)=>{alert('Preview only. In the app, this opens Apple’s purchase sheet.');done({cancelled:true});},restore:done=>done({entitled:false}),open:url=>window.open(url,'_blank','noopener'),back:()=>start()});window.view=view;}document.querySelector('#restart').onclick=()=>start();document.querySelector('#show-paywall').onclick=()=>start('paywall');document.querySelector('#show-gift').onclick=()=>start('gift');start(new URLSearchParams(location.search).get('screen')==='gift'?'gift':undefined);
</script></body></html>
